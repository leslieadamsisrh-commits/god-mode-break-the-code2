name: GOD MODE AutoPlay QA
on:
  workflow_dispatch:
    inputs:
      matches:
        description: Bot matches to simulate
        required: false
        default: '10'
  push:
    branches: [studio/raptor-combat-lab-01]
    paths: ['lib/game.ts', 'lib/bayBridgeMap.ts', 'scripts/autoplay-qa.cjs', '.github/workflows/autoplay-qa.yml']
jobs:
  headless-autoplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and test bundler
        run: npm install --no-audit --no-fund --package-lock=false && npm install --no-save --no-audit --no-fund --package-lock=false esbuild
      - name: Simulate bot matches
        run: node scripts/autoplay-qa.cjs
        env:
          QA_MATCHES: ${{ github.event.inputs.matches || '10' }}
          QA_SECONDS: '30'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoplay-telemetry
          path: qa-output/
