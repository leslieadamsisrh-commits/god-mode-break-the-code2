name: Build 27A elevation candidate verification
on:
  push:
    branches:
      - studio/build27a-xyz-elevation-lab
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: XYZ elevation tests
        run: node tests/build27a.cjs
      - name: Build 26 camera tests
        run: node tests/build26.cjs
      - name: Build 25 arena tests
        run: node tests/build25.cjs
