name: Raptor V2 asset gate
on:
  push:
    branches:
      - studio/build39g-sprite-integration-gate
    paths:
      - 'public/assets/raptor-v2/**'
      - 'scripts/install_raptor_39p.py'
      - '.github/workflows/raptor-asset-gate.yml'
  workflow_dispatch:
jobs:
  validate-raptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Validate 64 minimal sprite files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('public/assets/raptor-v2')
          dirs=('right','front-right','front','front-left','left','back-left','back','back-right')
          missing=[]; invalid=[]
          for family in ('run','idle'):
              for direction in dirs:
                  for i in range(4):
                      path=root/family/direction/f'{i:03}.png'
                      if not path.exists():
                          missing.append(str(path));continue
                      try:
                          with Image.open(path) as im:
                              if im.format!='PNG' or im.size!=(512,512) or im.mode!='RGBA':
                                  invalid.append(str(path));continue
                              lo,hi=im.getchannel('A').getextrema()
                              if lo==hi:invalid.append(str(path))
                      except Exception:invalid.append(str(path))
          print(f'Missing: {len(missing)}; invalid: {len(invalid)}')
          if missing: print('\n'.join(missing))
          if invalid: print('\n'.join(invalid))
          if missing or invalid:raise SystemExit(1)
          print('64 provisional assets pass technical format gate; visual review still required.')
          PY
