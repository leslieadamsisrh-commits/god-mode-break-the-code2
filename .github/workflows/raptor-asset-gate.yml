name: Raptor V2 asset gate
on:
  push:
    branches:
      - studio/build39g-sprite-integration-gate
      - studio/build39p-playable-raptor-v2
      - studio/build39q-raptor-action-animation
  workflow_dispatch:
jobs:
  validate-raptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: python scripts/validate_raptor_39p.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/raptor39p.cjs
      - run: node tests/raptor39q.cjs
      - run: npm run build
