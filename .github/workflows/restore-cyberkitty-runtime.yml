name: Restore Cyber Kitty Runtime
on:
  workflow_dispatch:
jobs:
  restore-and-install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: god-mode-sprite-library
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified artwork
        run: python tools/restore-checkpoint-art.py
      - name: Verify and stage runtime
        run: |
          SRC=recovery/shotgun-lab-v57/assets/shotgun-complete/runtime
          for f in run-d00.webp slide-d00.webp cover-d00.webp ready-d00.webp; do test -f "$SRC/$f"; done
          mkdir -p /tmp/cyberkitty-runtime
          cp "$SRC"/run-d*.webp /tmp/cyberkitty-runtime/
          cp "$SRC"/slide-d*.webp /tmp/cyberkitty-runtime/
          cp "$SRC"/cover-d*.webp /tmp/cyberkitty-runtime/
          cp "$SRC"/ready-d*.webp /tmp/cyberkitty-runtime/
          cp "$SRC"/strafe-*.webp /tmp/cyberkitty-runtime/ 2>/dev/null || true
          cp "$SRC"/backpedal-*.webp /tmp/cyberkitty-runtime/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: cyberkitty-runtime-v11
          path: /tmp/cyberkitty-runtime
      - name: Install runtime into playable branch
        run: |
          git checkout combat-lab-system08
          mkdir -p combat-lab/assets/cyberkitty
          cp /tmp/cyberkitty-runtime/* combat-lab/assets/cyberkitty/
          git config user.name "god-mode-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add combat-lab/assets/cyberkitty
          git diff --cached --quiet && exit 0
          git commit -m "v11: install restored Cyber Kitty runtime sprites"
          git push origin combat-lab-system08
